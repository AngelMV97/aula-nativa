name: Deploy Client to Vercel

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'client/**'
      - '.github/workflows/deploy-client.yml'
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run linter
        working-directory: ./client
        run: npm run lint --if-present || true

      - name: Build project
        working-directory: ./client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Check Vercel Credentials
        id: check-vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Vercel credentials are not configured"
            echo "ℹ️ To enable automatic deployments:"
            echo "   1. Create a Vercel project and link it to your repo"
            echo "   2. Get VERCEL_TOKEN from Vercel Settings → Tokens"
            echo "   3. Get VERCEL_ORG_ID and VERCEL_PROJECT_ID from project settings"
            echo "   4. Add all three as GitHub Secrets"
            echo "   5. Also add VITE_API_URL, VITE_SUPABASE_URL, and VITE_SUPABASE_ANON_KEY"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && steps.check-vercel.outputs.configured == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./client
          vercel-args: '--prod'

      - name: Deploy to Vercel (Preview)
        if: github.ref != 'refs/heads/main' && steps.check-vercel.outputs.configured == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./client